<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ligatures</title>
<style>
:root {
  --bg: #f7f6f3; --panel: #ffffff; --ink: #1c1b19; --muted: #66635d; --line: #e4e1db; --control-line: #8c8880;
  --accent: #2f5bea; --accent-ink: #ffffff; --ok: #1a7a43; --danger: #c43d3d; --chip: #efede8;
  --shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #141414; --panel: #1d1d1c; --ink: #ecebe8; --muted: #9a978f; --line: #2f2e2b; --control-line: #6e6b65;
    --accent: #7b9bff; --accent-ink: #0d0d0d; --ok: #4cc27f; --danger: #ff7a7a; --chip: #272725;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
button, input, select { font: inherit; color: inherit; }
header { position: sticky; top: 0; z-index: 10; background: color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
/* top bar: an edge-to-edge strip of cells divided by 1px lines, like the menu strip and the font grid */
.bar { display: flex; align-items: stretch; min-height: 64px; border-bottom: 1px solid var(--line); }
.bar > * { border-right: 1px solid var(--line); }
.bar > :last-child { border-right: 0; }
.brand { flex: none; display: flex; flex-direction: column; justify-content: center; margin: 0; padding: 12px 28px 12px 32px;
  font-size: inherit; line-height: 1.2; }
.brand-name { font-weight: 700; font-size: 18px; letter-spacing: -.01em; }
.brand-sub { font-size: 12px; font-weight: 400; color: var(--muted); }
.bar-cell { transition: background-color .15s; }
.bar-cell:hover, .bar-cell:focus-within { background: color-mix(in srgb, var(--chip) 55%, transparent); }
#preview { flex: 1 1 0; min-width: 80px; margin: 0; padding: 0 24px; border: 0; border-right: 1px solid var(--line); border-radius: 0; background: none;
  color: var(--ink); font-size: 15px; outline: none; }
#preview::placeholder { color: var(--muted); }
/* search: a square cell with a magnifying glass that widens into a field */
.search-wrap { flex: 0 1 auto; min-width: 60px; display: flex; align-items: stretch; }  /* may shrink when space is tight */
.search-wrap button { flex: none; width: 60px; border: 0; background: none; color: var(--muted); cursor: pointer; display: flex;
  align-items: center; justify-content: center; }
.search-wrap button:hover, .search-wrap.open button { color: var(--ink); }
.search-wrap button:focus-visible { outline: none; box-shadow: inset 0 0 0 2px var(--accent); }
#search { flex: 1 1 auto; min-width: 0; width: 0; padding: 0; border: 0; background: none; outline: none; color: var(--ink); opacity: 0; visibility: hidden;
  transition: width .22s ease, padding .22s ease, opacity .15s ease, visibility 0s linear .22s; }
.search-wrap.open #search { width: 240px; padding: 0 20px 0 0; opacity: 1; visibility: visible;
  transition: width .22s ease, padding .22s ease, opacity .15s ease .05s, visibility 0s; }
@media (prefers-reduced-motion: reduce) { #search, .search-wrap.open #search { transition: none; } }
.size { flex: none; display: flex; align-items: center; gap: 12px; padding: 0 32px 0 24px; color: var(--muted); }
#sizeVal { min-width: 4ch; font-variant-numeric: tabular-nums; }
/* preview-size slider: thin track filled up to the handle (--fill is set from JS), themed via tokens */
#size { -webkit-appearance: none; appearance: none; width: 120px; height: 20px; margin: 0; background: none; cursor: pointer; }
#size:focus { outline: none; }
#size::-webkit-slider-runnable-track { height: 2px; border-radius: 999px;
  background: linear-gradient(to right, var(--accent) var(--fill, 27%), var(--control-line) var(--fill, 27%)); }
/* handle: an outlined circle that fills on hover, while dragging and on keyboard focus */
#size::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; box-sizing: border-box; width: 14px; height: 14px; margin-top: -6px;
  border-radius: 50%; background: var(--bg); border: 1.5px solid var(--accent); transition: background-color .15s ease; }
#size:hover::-webkit-slider-thumb, #size:active::-webkit-slider-thumb, #size:focus-visible::-webkit-slider-thumb { background: var(--accent); }
#size:focus-visible::-webkit-slider-thumb { box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 35%, transparent); }
#size::-moz-range-track { height: 2px; border-radius: 999px; background: var(--control-line); }
#size::-moz-range-progress { height: 2px; border-radius: 999px; background: var(--accent); }
#size::-moz-range-thumb { box-sizing: border-box; width: 14px; height: 14px; border-radius: 50%; background: var(--bg);
  border: 1.5px solid var(--accent); transition: background-color .15s ease; }
#size:hover::-moz-range-thumb, #size:active::-moz-range-thumb, #size:focus-visible::-moz-range-thumb { background: var(--accent); }
#size:focus-visible::-moz-range-thumb { box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 35%, transparent); }
@media (prefers-reduced-motion: reduce) {
  #size::-webkit-slider-thumb { transition: none; }  /* kept separate: one unknown pseudo-element voids a whole rule */
  #size::-moz-range-thumb { transition: none; }
}
.row2 { padding: 16px 32px; display: flex; flex-wrap: wrap; gap: 12px 6px; align-items: center; }
/* menus and the view toggle: an edge-to-edge strip of cells divided by 1px lines, like the font grid */
.row3 { display: flex; border-top: 1px solid var(--line); }
.menus { display: flex; flex-wrap: nowrap; flex: 1 1 auto; min-width: 0; }
.menu-cell { position: relative; display: flex; align-items: center; min-width: 0; border-right: 1px solid var(--line);
  transition: background-color .15s; }
.menu-cell:hover, .menu-cell:focus-within { background: color-mix(in srgb, var(--chip) 55%, transparent); }
.menu-cell select { -webkit-appearance: none; appearance: none; width: 100%; min-width: 0; max-width: 260px; margin: 0;
  padding: 14px 44px 14px 20px; border: 0; border-radius: 0; background: none; color: var(--ink); cursor: pointer;
  text-overflow: ellipsis; outline: none; }
.menu-cell:first-child select { padding-left: 32px; }
.menu-cell select:focus-visible { box-shadow: inset 0 0 0 2px var(--accent); }
.menu-cell::after { content: ""; position: absolute; right: 22px; top: 50%; width: 6px; height: 6px; margin-top: -5px; pointer-events: none;
  border-right: 1.5px solid var(--muted); border-bottom: 1.5px solid var(--muted); transform: rotate(45deg); }
.menu-cell:focus-within::after { border-color: var(--accent); }
.view-cell { flex: none; align-items: stretch; margin-left: auto; border-right: 0; border-left: 1px solid var(--line); }  /* pinned to the right; never squeezed: the menus shrink instead */
.view-cell::after { display: none; }
.view-cell:hover, .view-cell:focus-within { background: none; }  /* each toggle button is its own cell instead */
.count-group { white-space: nowrap; }
.chip { border: 1px solid transparent; background: var(--chip); border-radius: 999px; padding: 5px 12px; cursor: pointer; white-space: nowrap; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.spacer { flex: 1; }
.count { color: var(--muted); margin-left: 6px; }
/* the font area spans the full window so grid and list lines run edge to edge; cells carry the inner spacing */
main { padding: 0 0 40px; overflow-x: hidden; overflow-x: clip; }  /* hide the grid's 1px overhang (clip where supported) */
/* grid view: no card boxes, just 1px lines between cells. Each cell draws its right and bottom
   line; the grid is 1px wider than its column and clipped, so the outer edges show no frame. */
#grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 0; }
#grid:not(.list) { margin-right: -1px; clip-path: inset(0 1px 1px 0); }
.card { display: flex; flex-direction: column; gap: 14px; min-height: 220px; padding: 32px; cursor: pointer;
  background: none; border: 0; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line);
  transition: background-color .15s; }
.card:hover { background: color-mix(in srgb, var(--chip) 50%, transparent); }
.card-top { display: flex; align-items: start; gap: 8px; }
.card-name { font-weight: 600; }
.card-meta { color: var(--muted); font-size: 12px; }
.card-top .grow { flex: 1; min-width: 0; }
.sample { flex: 1; overflow: hidden; word-break: break-word; line-height: 1.2; color: var(--ink);
  display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; }
.sample.loading { color: color-mix(in srgb, var(--ink) 25%, transparent); }
.icon-btn { border: 0; background: none; cursor: pointer; padding: 4px; border-radius: 8px; color: var(--muted); font-size: 18px; line-height: 1; }
.icon-btn:hover { background: var(--chip); }
.icon-btn.on { color: #e0a100; }
.btn { border: 1px solid var(--control-line); background: var(--panel); border-radius: 9px; padding: 6px 12px; cursor: pointer; white-space: nowrap; }
.btn:hover { border-color: var(--ink); }
a.btn { color: var(--ink); text-decoration: none; display: inline-flex; align-items: center; gap: 4px; }
a.btn:visited { color: var(--ink); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
a.btn:hover { text-decoration: underline; text-underline-offset: 2px; }
/* visible keyboard focus for every control (contrast ≥ 3:1 in both themes) */
.btn:focus-visible, .chip:focus-visible, .icon-btn:focus-visible, .card:focus-visible, a:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 2px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.danger { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 35%, var(--line)); }
.btn.danger:hover, .btn.danger[data-armed] { background: var(--danger); border-color: var(--danger); color: var(--panel); }
.installed-tag { color: var(--ok); font-size: 12px; font-weight: 600; white-space: nowrap; align-self: center; }
.btn:disabled { opacity: .6; cursor: progress; }
.badge { font-size: 11px; padding: 1px 7px; border-radius: 999px; background: var(--chip); color: var(--muted); }
#sentinel { height: 40px; }
.badge.new { background: var(--accent); color: var(--accent-ink); }
#newBanner { margin: 16px 0; padding: 0 32px; }
#newBanner .inner { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; background: color-mix(in srgb, var(--accent) 12%, var(--panel));
  border: 1px solid color-mix(in srgb, var(--accent) 35%, var(--line)); border-radius: 12px; padding: 10px 14px; }
#newBanner .msg { flex: 1; min-width: 200px; }
.checked { color: var(--muted); font-size: 12px; margin-left: 6px; }
.empty { text-align: center; color: var(--muted); padding: 80px 20px; }

/* detail drawer */
#scrim { position: fixed; inset: 0; background: rgba(0,0,0,.35); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 20; }
#scrim.open { opacity: 1; pointer-events: auto; }
#drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(760px, 100vw); background: var(--panel); z-index: 21;
  transform: translateX(100%); transition: transform .25s ease; display: flex; flex-direction: column; border-left: 1px solid var(--line); }
#drawer.open { transform: none; }
/* details panel: the same cell design as the main view: square corners and edge-to-edge 1px lines */
.d-head { display: flex; align-items: stretch; border-bottom: 1px solid var(--line); }
.d-title { flex: 1; min-width: 0; padding: 26px 32px 22px; }
.d-head h2 { margin: 0 0 4px; font-size: 28px; letter-spacing: -.01em; line-height: 1.15; }
.d-close { flex: none; width: 64px; border: 0; border-left: 1px solid var(--line); border-radius: 0; background: none; color: var(--muted);
  font-size: 18px; cursor: pointer; transition: background-color .15s, color .15s; }
.d-close:hover { color: var(--ink); background: color-mix(in srgb, var(--chip) 55%, transparent); }
.d-close:focus-visible { outline: none; box-shadow: inset 0 0 0 2px var(--accent); }
.d-body { overflow-x: hidden; overflow-y: auto; padding: 0 0 40px; }  /* x hidden: the action strip overhangs 1px to hide its outer line */
/* actions: a strip of cells that stretch to fill each row; lines stay aligned when it wraps */
.d-actions { display: flex; flex-wrap: wrap; margin-right: -1px; clip-path: inset(0 1px 0 0); }
#drawer .d-actions > * { flex: 1 1 auto; display: flex; align-items: center; justify-content: center; gap: 6px; min-height: 52px;
  padding: 0 20px; border: 0; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); border-radius: 0;
  background: none; color: var(--ink); font-size: 14px; white-space: nowrap; transition: background-color .15s, color .15s; }
#drawer .d-actions .btn:hover { background: color-mix(in srgb, var(--chip) 55%, transparent); text-decoration: none; }
#drawer .d-actions .btn:focus-visible { outline: none; box-shadow: inset 0 0 0 2px var(--accent); }
#drawer .d-actions .btn.primary { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
#drawer .d-actions .btn.primary:hover { background: color-mix(in srgb, var(--accent) 88%, var(--ink)); }
#drawer .d-actions .btn.danger { color: var(--danger); }
#drawer .d-actions .btn.danger:hover, #drawer .d-actions .btn.danger[data-armed] { background: var(--danger); color: var(--panel); }
#drawer .d-actions .installed-tag { flex: 0 1 auto; color: var(--ok); font-size: 13px; font-weight: 600; }
.d-note { padding: 12px 32px; border-bottom: 1px solid var(--line); color: var(--muted); font-size: 12px; }
/* section labels and full-width rows */
#drawer h3 { margin: 0; padding: 26px 32px 10px; border-bottom: 1px solid var(--line); font-size: 11px; font-weight: 600;
  text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
.style-row { padding: 18px 32px; border-bottom: 1px solid var(--line); }
.style-row .label { color: var(--muted); font-size: 12px; margin-bottom: 4px; }
.style-row .s { font-size: 34px; line-height: 1.2; word-break: break-word; }
/* about: a two-column table of cells */
dl.info { display: grid; grid-template-columns: minmax(120px, 200px) 1fr; margin: 0; }
dl.info dt, dl.info dd { margin: 0; padding: 12px 32px; border-bottom: 1px solid var(--line); }
dl.info dt { color: var(--muted); border-right: 1px solid var(--line); }
dl.info dd { padding-left: 20px; word-break: break-word; }
pre.code { margin: 0; padding: 18px 32px; border-bottom: 1px solid var(--line); overflow: auto; font-size: 12px; line-height: 1.6;
  white-space: pre-wrap; word-break: break-all; font-family: ui-monospace, "SF Mono", Menlo, monospace; }

#toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px); background: var(--ink); color: var(--bg);
  padding: 10px 16px; border-radius: 10px; opacity: 0; transition: all .2s; z-index: 30; pointer-events: none; max-width: 90vw; }
#toast.show { opacity: 1; transform: translateX(-50%); }
/* layout switch */
/* grid/list toggle: square-cornered buttons that are cells of the menu strip */
.seg { display: flex; }
.seg button { display: flex; align-items: center; padding: 0 18px; border: 0; border-radius: 0; background: none; cursor: pointer;
  color: var(--muted); transition: background-color .15s, color .15s; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button:hover { color: var(--ink); background: color-mix(in srgb, var(--chip) 55%, transparent); }
.seg button[aria-pressed="true"] { color: var(--ink); background: var(--chip); }
.seg button:focus-visible { outline: none; box-shadow: inset 0 0 0 2px var(--accent); }

/* list view: one row per family — name and actions on top, sample underneath, no surrounding box */
#grid.list { grid-template-columns: 1fr; gap: 0; }
#grid.list .card { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; column-gap: 10px; row-gap: 6px;
  min-height: 0; background: none; border: 0; border-radius: 0; box-shadow: none; padding: 22px 32px; }
#grid.list .card + .card { border-top: 1px solid var(--line); }
#grid.list .card:hover { background: color-mix(in srgb, var(--chip) 50%, transparent); }
#grid.list .card-top { display: contents; }
#grid.list .card-top .grow { grid-column: 1; grid-row: 1; }
#grid.list .card-top .icon-btn { grid-column: 2; grid-row: 1; }
#grid.list .sample { grid-column: 1 / -1; grid-row: 2; display: block; white-space: nowrap; text-overflow: ellipsis; }

/* layout switch: old layout fades out, then visible cards build up one after another */
#grid { transition: opacity .12s ease-out; }
#grid.fading { opacity: 0; }
@keyframes build-in { from { opacity: 0; transform: translateY(10px) scale(.985); } to { opacity: 1; transform: none; } }
#grid .card.build-in { animation: build-in .38s cubic-bezier(.2, .7, .2, 1) both; animation-delay: calc(var(--i, 0) * 40ms); }
/* details panel: style rows build up one after another as the panel slides in */
.style-row.build-in { animation: build-in .38s cubic-bezier(.2, .7, .2, 1) both; animation-delay: calc(120ms + var(--i, 0) * 45ms); }
@media (prefers-reduced-motion: reduce) {
  #grid { transition: none; }
  #grid .card.build-in, .style-row.build-in { animation: none; }
}

@media (max-width: 600px) {
  .d-title, #drawer h3, .style-row, dl.info dt, pre.code, .d-note { padding-left: 20px; padding-right: 20px; }
  dl.info { grid-template-columns: minmax(96px, 120px) 1fr; }
  dl.info dd { padding-right: 20px; }
  .row2, #newBanner, .card, #grid.list .card { padding-left: 20px; padding-right: 20px; }
  .bar { flex-wrap: wrap; }
  .brand { flex: 1 1 100%; padding: 14px 20px; border-right: 0; border-bottom: 1px solid var(--line); }
  #preview { min-height: 52px; padding: 0 20px; }
  .search-wrap.open { flex: 1 1 100%; order: 3; border-top: 1px solid var(--line); border-right: 0; }
  .search-wrap.open #search { width: 100%; }
  .size { flex: 1 1 100%; order: 4; min-height: 52px; padding: 0 20px; border-top: 1px solid var(--line); }
  .size #size { flex: 1; }
  .menus { flex: 1 1 100%; }
  .menu-cell:not(.view-cell) { flex: 1 1 0; }
  .menu-cell select, .menu-cell:first-child select { padding-left: 20px; padding-right: 36px; }
  .menu-cell::after { right: 16px; }
  #grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1 class="brand"><span class="brand-name">Ligatures</span><span class="brand-sub">The free fonts manager</span></h1>
    <input id="preview" class="bar-cell" type="text" placeholder="Type to preview…" value="" aria-label="Preview text">
    <div class="search-wrap bar-cell" id="searchWrap">
      <button id="searchBtn" type="button" aria-label="Search fonts" aria-expanded="false" aria-controls="search" title="Search ( / )">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="7" cy="7" r="5"/><path d="m11 11 3.5 3.5"/></svg>
      </button>
      <input id="search" type="search" placeholder="Search families or designers" autocomplete="off" aria-label="Search families or designers">
    </div>
    <label class="size bar-cell"><input id="size" type="range" min="14" max="96" value="36" aria-label="Preview size"><span id="sizeVal">36px</span></label>
  </div>
  <div class="row2">
    <div id="views"></div>
    <span style="width:10px"></span>
    <div id="cats"></div>
    <div class="spacer"></div>
    <span class="count-group"><span class="count" id="count"></span><span class="checked" id="checked"></span></span>
  </div>
  <div class="row3">
    <div class="menus">
      <div class="menu-cell">
        <select id="source" title="Library" aria-label="Font library"></select>
      </div>
      <div class="menu-cell">
        <select id="subset" title="Language / script" aria-label="Language or script"></select>
      </div>
      <div class="menu-cell">
        <select id="sort" title="Sort" aria-label="Sort order">
          <option value="popularity">Most popular</option>
          <option value="trending">Trending</option>
          <option value="newest">Newest</option>
          <option value="name">Name</option>
          <option value="styles">Most styles</option>
        </select>
      </div>
      <div class="menu-cell view-cell">
        <div class="seg" id="layout" role="group" aria-label="Layout">
          <button data-layout="grid" title="Grid view" aria-label="Grid view"><svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><rect x="1" y="1" width="6" height="6" rx="1.5"/><rect x="9" y="1" width="6" height="6" rx="1.5"/><rect x="1" y="9" width="6" height="6" rx="1.5"/><rect x="9" y="9" width="6" height="6" rx="1.5"/></svg></button>
          <button data-layout="list" title="List view" aria-label="List view"><svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><rect x="1" y="2" width="14" height="2.5" rx="1"/><rect x="1" y="6.75" width="14" height="2.5" rx="1"/><rect x="1" y="11.5" width="14" height="2.5" rx="1"/></svg></button>
        </div>
      </div>
    </div>
  </div>
</header>

<div id="newBanner" hidden></div>
<main>
  <div id="grid"></div>
  <div id="empty" class="empty" hidden></div>
  <div id="sentinel"></div>
</main>

<div id="scrim"></div>
<aside id="drawer" aria-hidden="true"></aside>
<div id="toast"></div>

<script>
const TOKEN = "__FM_TOKEN__";
const DEFAULT_TEXT = "The quick brown fox jumps over the lazy dog";
const PAGE = 48;
const CATS = ["All", "Sans Serif", "Serif", "Display", "Handwriting", "Monospace"];
const VIEWS = ["Browse", "New", "Installed", "Favorites"];
const WEIGHT_NAMES = {50:"Hairline",100:"Thin",200:"ExtraLight",300:"Light",400:"Regular",500:"Medium",350:"Book",600:"SemiBold",700:"Bold",800:"ExtraBold",900:"Black",1000:"ExtraBlack"};
const SOURCE_NAMES = {google: "Google Fonts", fontshare: "Fontshare"};

const S = {
  families: [], byName: new Map(), installed: {}, favorites: new Set(), fontDir: "",
  view: "Browse", cat: "All", subset: "", source: "", sort: "popularity", q: "", layout: "grid",
  text: "", size: 36, list: [], shown: 0, busy: new Set(),
};
const loadedCss = new Set();
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
// For text inside a quoted CSS string (style attributes and stylesheets): everything except letters, digits,
// spaces, dots and hyphens becomes a CSS hex escape, so names from the catalogs can't break out of the string.
const cssStr = (s) => String(s).replace(/[^\w .-]/g, (c) => "\\" + c.codePointAt(0).toString(16) + " ");

// Restore per-browser preferences
try {
  const p = JSON.parse(localStorage.getItem("fm-prefs") || "{}");
  Object.assign(S, {text: p.text || "", size: p.size || 36, sort: p.sort || "popularity", cat: p.cat || "All", subset: p.subset || "", source: SOURCE_NAMES[p.source] ? p.source : "", layout: p.layout === "list" ? "list" : "grid"});
} catch (e) {}
function savePrefs() {
  try { localStorage.setItem("fm-prefs", JSON.stringify({text: S.text, size: S.size, sort: S.sort, cat: S.cat, subset: S.subset, source: S.source, layout: S.layout})); } catch (e) {}
}

// ---------- API ----------
async function api(path, body) {
  const opts = body ? {method: "POST", headers: {"Content-Type": "application/json", "X-FM-Token": TOKEN}, body: JSON.stringify(body)} : {};
  const r = await fetch(path, opts);
  const data = await r.json().catch(() => ({error: r.statusText}));
  if (!r.ok || data.error) throw new Error(data.error || r.statusText);
  return data;
}
async function refreshState() {
  const st = await api("/api/state");
  S.installed = st.installed; S.favorites = new Set(st.favorites); S.fontDir = st.fontDir;
  S.newFamilies = st.newFamilies || {}; S.lastCheck = st.lastCheck;
}

// ---------- Google Fonts CSS ----------
function cssUrl(family, variants) {
  const fam = encodeURIComponent(family).replace(/%20/g, "+");
  if (variants.length === 1 && variants[0] === "400") return `https://fonts.googleapis.com/css2?family=${fam}&display=swap`;
  const tuples = variants.map((v) => [v.endsWith("i") ? 1 : 0, parseInt(v) || 400])
    .sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  const hasItal = tuples.some((t) => t[0] === 1);
  const spec = hasItal ? "ital,wght@" + tuples.map((t) => t.join(",")).join(";")
                       : "wght@" + tuples.map((t) => t[1]).join(";");
  return `https://fonts.googleapis.com/css2?family=${fam}:${spec}&display=swap`;
}
function loadCss(url) {
  if (loadedCss.has(url)) return Promise.resolve();
  loadedCss.add(url);
  return new Promise((res) => {
    const l = document.createElement("link");
    l.rel = "stylesheet"; l.href = url; l.onload = l.onerror = res;
    document.head.appendChild(l);
  });
}
function previewVariant(f) { return f.variants.includes("400") ? "400" : f.variants[0]; }
// The CSS family a preview renders with. Fontshare fonts get their own name, so they never
// clash with an installed font or a Google family of the same name.
function previewFamily(f) { return f.source === "fontshare" ? `FS ${f.slug}` : f.family; }
const loadedFaces = new Set();
function loadPreview(f, variants) {
  if (f.source !== "fontshare") return loadCss(cssUrl(f.family, variants));
  const fam = previewFamily(f), rules = [];
  for (const v of variants) {
    const face = f.faces[v];
    if (!face || loadedFaces.has(fam + v) || !/^https:\/\/cdn\.fontshare\.com\/[\w\/.-]+$/.test(face.url)) continue;
    loadedFaces.add(fam + v);
    rules.push(`@font-face { font-family: "${cssStr(fam)}"; src: url("${face.url}") format("woff2"); font-weight: ${parseInt(v) || 400}; font-style: ${v.endsWith("i") ? "italic" : "normal"}; font-display: swap; }`);
  }
  if (rules.length) {
    const style = document.createElement("style");
    style.textContent = rules.join("\n");
    document.head.appendChild(style);
  }
  return Promise.all(variants.map((v) => document.fonts.load(`${v.endsWith("i") ? "italic " : ""}${parseInt(v) || 400} 16px "${cssStr(fam)}"`).catch(() => {})));
}
function variantStyle(v) { return `font-weight:${parseInt(v) || 400};font-style:${v.endsWith("i") ? "italic" : "normal"}`; }
function variantLabel(v) { const w = parseInt(v) || 400; return `${WEIGHT_NAMES[w] || w} ${w}${v.endsWith("i") ? " Italic" : ""}`; }

// ---------- filtering ----------
function computeList() {
  const q = S.q.trim().toLowerCase();
  let list = S.families.filter((f) => {
    if (S.view === "Installed" && !S.installed[f.family]) return false;
    if (S.view === "Favorites" && !S.favorites.has(f.family)) return false;
    if (S.view === "New" && !S.newFamilies[f.family]) return false;
    if (S.cat !== "All" && f.category !== S.cat) return false;
    if (S.subset && !f.subsets.includes(S.subset)) return false;
    if (S.source && (f.source || "google") !== S.source) return false;
    if (q && !f.family.toLowerCase().includes(q) && !(f.designers || []).some((d) => d.toLowerCase().includes(q))) return false;
    return true;
  });
  const by = {
    popularity: (a, b) => a.popularity - b.popularity,
    trending: (a, b) => a.trending - b.trending,
    newest: (a, b) => (b.dateAdded || "").localeCompare(a.dateAdded || ""),
    name: (a, b) => a.family.localeCompare(b.family),
    styles: (a, b) => b.variants.length - a.variants.length || a.popularity - b.popularity,
  }[S.sort];
  if (q) { // exact / prefix matches first
    const rank = (f) => { const n = f.family.toLowerCase(); return n === q ? 0 : n.startsWith(q) ? 1 : 2; };
    list.sort((a, b) => rank(a) - rank(b) || by(a, b));
  } else list.sort(by);
  S.list = list;
}

// ---------- rendering ----------
const io = new IntersectionObserver((entries) => {
  for (const e of entries) if (e.isIntersecting) {
    io.unobserve(e.target);
    const f = S.byName.get(e.target.dataset.family);
    const el = e.target.querySelector(".sample");
    loadPreview(f, [previewVariant(f)]).then(() => el.classList.remove("loading"));
  }
}, {rootMargin: "300px"});

function installBtn(f) {
  const fam = esc(f.family);
  if (S.busy.has(f.family)) return `<button class="btn" disabled data-act="none">Working…</button>`;
  if (S.installed[f.family]) return `<span class="installed-tag">✓ Installed</span><button class="btn danger" data-act="uninstall" data-family="${fam}">Uninstall</button>`;
  return `<button class="btn primary" data-act="install" data-family="${fam}">Install</button>`;
}

function cardHtml(f) {
  const v = previewVariant(f);
  const fav = S.favorites.has(f.family);
  const fam = esc(f.family);
  const inst = !!S.installed[f.family];
  return `<article class="card" data-family="${fam}">
    <div class="card-top">
      <div class="grow">
        <div class="card-name">${fam}</div>
        <div class="card-meta">${esc(f.category)} · ${f.variants.length} style${f.variants.length > 1 ? "s" : ""}${f.axes.length ? ' · <span class="badge">Variable</span>' : ""}${f.source === "fontshare" ? ' · <span class="badge">Fontshare</span>' : ""}${S.newFamilies[f.family] ? ' · <span class="badge new">New</span>' : ""}${inst ? ' · <span style="color:var(--ok);white-space:nowrap">✓ Installed</span>' : ""}</div>
      </div>
      <button class="icon-btn ${fav ? "on" : ""}" data-act="fav" data-family="${fam}" title="Favorite">${fav ? "★" : "☆"}</button>
    </div>
    <div class="sample loading" style="font-family:'${cssStr(previewFamily(f))}',var(--fallback, sans-serif);font-size:${S.size}px;${variantStyle(v)}">${esc(S.text || DEFAULT_TEXT)}</div>
  </article>`;
}

function render() {
  computeList();
  const grid = $("#grid");
  grid.innerHTML = "";
  S.shown = 0;
  $("#count").textContent = `${S.list.length.toLocaleString()} famil${S.list.length === 1 ? "y" : "ies"}`;
  renderChecked();
  const empty = $("#empty");
  empty.hidden = S.list.length > 0;
  if (!S.list.length) {
    empty.textContent = S.view === "Installed" ? "No fonts installed yet. Hit Install on any family."
      : S.view === "Favorites" ? "No favorites yet. Tap ☆ on a card to save it here."
      : S.view === "New" ? "No new fonts right now. The app checks Google Fonts each time it starts." : "No families match your filters.";
  }
  more();
}
function more() {
  const grid = $("#grid");
  const next = S.list.slice(S.shown, S.shown + PAGE);
  if (!next.length) return;
  grid.insertAdjacentHTML("beforeend", next.map(cardHtml).join(""));
  [...grid.children].slice(S.shown).forEach((c) => io.observe(c));
  S.shown += next.length;
}
new IntersectionObserver((e) => { if (e[0].isIntersecting && S.list.length) more(); }, {rootMargin: "800px"}).observe($("#sentinel"));

function updateCard(family) {
  document.querySelectorAll(`.card[data-family="${CSS.escape(family)}"]`).forEach((card) => {
    const f = S.byName.get(family);
    const tmp = document.createElement("div");
    tmp.innerHTML = cardHtml(f);
    card.querySelector(".card-top").replaceWith(tmp.querySelector(".card-top"));
  });
  if (drawerFamily === family) openDrawer(family, true);
}

function renderChips() {
  const newCount = Object.keys(S.newFamilies).length;
  $("#views").innerHTML = VIEWS.filter((v) => v !== "New" || newCount || S.view === "New").map((v) => `<button class="chip" aria-pressed="${S.view === v}" data-view="${v}">${v}${
    v === "Installed" ? ` <span class="count">${Object.keys(S.installed).length}</span>` :
    v === "Favorites" ? ` <span class="count">${S.favorites.size}</span>` :
    v === "New" ? ` <span class="count">${newCount}</span>` : ""}</button>`).join(" ");
  $("#cats").innerHTML = CATS.map((c) => `<button class="chip" aria-pressed="${S.cat === c}" data-cat="${c}">${c}</button>`).join(" ");
}

// ---------- drawer ----------
let drawerFamily = null;
function openDrawer(family, keepScroll) {
  const f = S.byName.get(family);
  drawerFamily = family;
  const d = $("#drawer");
  const scroll = keepScroll ? (d.querySelector(".d-body") || {}).scrollTop : 0;
  const fam = esc(f.family);
  const ff = `font-family:'${cssStr(previewFamily(f))}',sans-serif`;
  const inst = S.installed[f.family];
  const fontshare = f.source === "fontshare";
  const generic = f.category === "Serif" ? "serif" : f.category === "Monospace" ? "monospace" : f.category === "Handwriting" ? "cursive" : "sans-serif";
  const embed = fontshare
    ? `<link href="https://api.fontshare.com/v2/css?f[]=${f.slug}@${f.variants.map((v) => f.faces[v].number).join(",")}&display=swap" rel="stylesheet">\n\nfont-family: "${f.family}", ${generic};`
    : `<link rel="preconnect" href="https://fonts.googleapis.com">\n<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n<link href="${cssUrl(f.family, f.variants)}" rel="stylesheet">\n\nfont-family: "${f.family}", ${generic};`;
  const pageUrl = fontshare ? f.link : `https://fonts.google.com/specimen/${encodeURIComponent(f.family).replace(/%20/g, "+")}`;
  d.innerHTML = `
    <div class="d-head">
      <div class="d-title">
        <h2 style="${ff}">${fam}</h2>
        <div class="card-meta">${esc((f.designers || []).join(", ") || "Unknown designer")}</div>
      </div>
      <button class="d-close" data-act="close" title="Close (Esc)" aria-label="Close details">✕</button>
    </div>
    <div class="d-body">
      <div class="d-actions">
        ${installBtn(f)}
        <button class="btn" data-act="fav" data-family="${fam}">${S.favorites.has(f.family) ? "★ Favorited" : "☆ Favorite"}</button>
        <a class="btn" target="_blank" rel="noopener" href="${esc(pageUrl)}">Open on ${SOURCE_NAMES[f.source] || "Google Fonts"} <span aria-hidden="true">↗</span><span class="sr-only"> (opens in a new tab)</span></a>
        <button class="btn" data-act="copy">Copy embed code</button>
      </div>
      ${inst ? `<div class="d-note">Installed ${inst.files} file${inst.files === 1 ? "" : "s"} to ${esc(S.fontDir)}${inst.missing ? ` · ${inst.missing} missing` : ""}</div>` : ""}
      <h3>Styles</h3>
      ${f.variants.map((v) => `<div class="style-row"><div class="label">${variantLabel(v)}</div><div class="s" style="${ff};${variantStyle(v)}">${esc(S.text || DEFAULT_TEXT)}</div></div>`).join("")}
      <h3>About</h3>
      <dl class="info">
        <dt>Library</dt><dd>${SOURCE_NAMES[f.source] || "Google Fonts"}</dd>
        <dt>Category</dt><dd>${esc(f.category)}</dd>
        <dt>Styles</dt><dd>${f.variants.length}</dd>
        ${f.axes.length ? `<dt>Variable axes</dt><dd>${f.axes.map((a) => `${esc(a.tag)} ${esc(a.min)}–${esc(a.max)}`).join(", ")}</dd>` : ""}
        <dt>Added</dt><dd>${esc(f.dateAdded || "—")}</dd>
        ${fontshare ? "" : `<dt>Updated</dt><dd>${esc(f.lastModified || "—")}</dd>
        <dt>Popularity</dt><dd>#${esc(f.popularity)}</dd>`}
        ${f.license ? `<dt>License</dt><dd>${esc(f.license)}</dd>` : ""}
        <dt>Scripts</dt><dd>${esc(f.subsets.filter((s) => s !== "menu").join(", "))}</dd>
      </dl>
      <h3>Use on the web</h3>
      <pre class="code" id="embed">${esc(embed)}</pre>
    </div>`;
  d.classList.add("open"); d.setAttribute("aria-hidden", "false");
  $("#scrim").classList.add("open");
  if (scroll) d.querySelector(".d-body").scrollTop = scroll;
  if (!keepScroll) {  // only on open, not when the panel refreshes after an install or favorite
    d.querySelectorAll(".style-row").forEach((row, i) => {
      row.style.setProperty("--i", Math.min(i, 12));  // cap the stagger so large families don't drag on
      row.classList.add("build-in");
      row.addEventListener("animationend", () => { row.classList.remove("build-in"); row.style.removeProperty("--i"); }, {once: true});
    });
  }
  loadPreview(f, f.variants);
}
function closeDrawer() {
  drawerFamily = null;
  $("#drawer").classList.remove("open"); $("#drawer").setAttribute("aria-hidden", "true");
  $("#scrim").classList.remove("open");
}

// ---------- actions ----------
let toastTimer;
function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 3200);
}

async function doInstall(family, uninstall) {
  S.busy.add(family); updateCard(family);
  try {
    const r = await api(uninstall ? "/api/uninstall" : "/api/install", {family});
    if (uninstall) toast(r.movedTo === "Trash" ? `Removed ${family} (moved to Trash)` : `Removed ${family} (files kept in ${r.movedTo})`);
    else toast(`Installed ${family} (${r.files} file${r.files === 1 ? "" : "s"})` + (r.skipped.length ? ` · ${r.skipped.length} already present` : ""));
    await refreshState();
  } catch (e) { toast(`Failed: ${e.message}`); }
  S.busy.delete(family);
  renderChips();
  if (S.view === "Installed") render(); else updateCard(family);
}

async function toggleFav(family) {
  const on = !S.favorites.has(family);
  try {
    const r = await api("/api/favorite", {family, on});
    S.favorites = new Set(r.favorites);
  } catch (e) { return toast(`Failed: ${e.message}`); }
  renderChips();
  if (S.view === "Favorites") render(); else updateCard(family);
}

document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-act],[data-view],[data-cat],.card");
  if (!t) return;
  if (t.dataset.view) { S.view = t.dataset.view; renderChips(); return render(); }
  if (t.dataset.cat) { S.cat = t.dataset.cat; savePrefs(); renderChips(); return render(); }
  const act = t.dataset.act;
  if (act === "install") return doInstall(t.dataset.family, false);
  if (act === "uninstall") {
    // Two-step confirm: first click arms the button, second click within 4s uninstalls.
    if (t.dataset.armed) return doInstall(t.dataset.family, true);
    t.dataset.armed = "1"; t.textContent = "Confirm?"; t.title = "Files will be moved to the Trash";
    setTimeout(() => { if (t.isConnected) { delete t.dataset.armed; t.textContent = "Uninstall"; } }, 4000);
    return;
  }
  if (act === "fav") return toggleFav(t.dataset.family);
  if (act === "show-new") { hideBanner(); S.view = "New"; renderChips(); return render(); }
  if (act === "dismiss-new") return hideBanner();
  if (act === "clear-new") return clearNew();
  if (act === "close") return closeDrawer();
  if (act === "copy") return navigator.clipboard.writeText($("#embed").textContent).then(() => toast("Embed code copied"));
  if (act) return;
  if (t.classList.contains("card")) openDrawer(t.dataset.family);
});
$("#scrim").addEventListener("click", closeDrawer);
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") closeDrawer();
  if (e.key === "/" && document.activeElement.tagName !== "INPUT") { e.preventDefault(); openSearch(); }
});

let searchTimer;
function openSearch() {
  $("#searchWrap").classList.add("open");
  $("#searchBtn").setAttribute("aria-expanded", "true");
  $("#search").focus();
}
function closeSearch() {
  $("#searchWrap").classList.remove("open");
  $("#searchBtn").setAttribute("aria-expanded", "false");
}
$("#searchBtn").addEventListener("click", () => {
  if (!$("#searchWrap").classList.contains("open")) return openSearch();
  if ($("#search").value) return $("#search").focus();  // keep a live query visible
  closeSearch();
});
$("#search").addEventListener("keydown", (e) => {
  if (e.key !== "Escape" || drawerFamily) return;
  e.target.value = ""; S.q = ""; render();
  closeSearch(); $("#searchBtn").focus();
});
// Collapse when focus leaves an empty field (but not when moving to the toggle button itself).
$("#searchWrap").addEventListener("focusout", (e) => {
  if (!$("#search").value && !$("#searchWrap").contains(e.relatedTarget)) closeSearch();
});
$("#search").addEventListener("input", (e) => { clearTimeout(searchTimer); searchTimer = setTimeout(() => { S.q = e.target.value; render(); }, 120); });
$("#preview").addEventListener("input", (e) => {
  S.text = e.target.value; savePrefs();
  const txt = S.text || DEFAULT_TEXT;
  document.querySelectorAll(".sample, .style-row .s").forEach((el) => (el.textContent = txt));
});
function updateSizeFill() {
  const el = $("#size");
  el.style.setProperty("--fill", ((el.value - el.min) / (el.max - el.min)) * 100 + "%");
}
$("#size").addEventListener("input", (e) => {
  S.size = +e.target.value; $("#sizeVal").textContent = S.size + "px"; savePrefs(); updateSizeFill();
  document.querySelectorAll(".sample").forEach((el) => (el.style.fontSize = S.size + "px"));
});
$("#sort").addEventListener("change", (e) => { S.sort = e.target.value; savePrefs(); render(); });
function applyLayout() {
  $("#grid").classList.toggle("list", S.layout === "list");
  document.querySelectorAll("#layout button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.layout === S.layout)));
}
let layoutSwitch = 0;  // ignores stale steps when the switch is clicked again mid-transition
function switchLayout() {
  const grid = $("#grid");
  const id = ++layoutSwitch;
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return applyLayout();
  grid.classList.add("fading");
  setTimeout(() => {
    if (id !== layoutSwitch) return;
    applyLayout();
    // Only cards in view take part; the rest are already in place when scrolled to.
    const cards = [...grid.children].filter((c) => {
      const r = c.getBoundingClientRect();
      return r.bottom > 0 && r.top < innerHeight;
    }).slice(0, 24);
    cards.forEach((c, i) => { c.classList.remove("build-in"); c.style.setProperty("--i", i); });
    void grid.offsetWidth;  // restart the animation if it was already running
    cards.forEach((c) => c.classList.add("build-in"));
    grid.classList.remove("fading");
    setTimeout(() => {
      if (id === layoutSwitch) cards.forEach((c) => { c.classList.remove("build-in"); c.style.removeProperty("--i"); });
    }, 380 + cards.length * 40 + 50);
  }, 120);
}
$("#layout").addEventListener("click", (e) => {
  const b = e.target.closest("[data-layout]");
  if (!b || b.dataset.layout === S.layout) return;
  S.layout = b.dataset.layout; savePrefs(); switchLayout();
});
$("#subset").addEventListener("change", (e) => { S.subset = e.target.value; savePrefs(); render(); });
$("#source").addEventListener("change", (e) => { S.source = e.target.value; savePrefs(); render(); });

// ---------- new fonts since last launch ----------
function renderBanner() {
  const b = $("#newBanner");
  const found = (S.lastCheck && S.lastCheck.found || []).filter((f) => S.byName.has(f) && S.newFamilies[f]);
  let dismissed = false;
  try { dismissed = sessionStorage.getItem("fm-new-dismissed") === String(S.lastCheck && S.lastCheck.at); } catch (e) {}
  if (!found.length || dismissed) { b.hidden = true; return; }
  const names = found.slice(0, 4).map(esc).join(", ") + (found.length > 4 ? ` and ${found.length - 4} more` : "");
  b.innerHTML = `<div class="inner"><span class="msg"><b>${found.length} new font${found.length === 1 ? "" : "s"}</b> since you last opened Ligatures: ${names}</span>
    <button class="btn primary" data-act="show-new">Show</button><button class="btn" data-act="dismiss-new">Dismiss</button></div>`;
  b.hidden = false;
}
function hideBanner() {
  try { sessionStorage.setItem("fm-new-dismissed", String(S.lastCheck && S.lastCheck.at)); } catch (e) {}
  $("#newBanner").hidden = true;
}
async function clearNew() {
  try { await api("/api/new/clear", {}); } catch (e) { return toast(`Failed: ${e.message}`); }
  S.newFamilies = {}; hideBanner();
  if (S.view === "New") S.view = "Browse";
  renderChips(); render();
}
function renderChecked() {
  const el = $("#checked");
  if (!S.lastCheck) { el.textContent = ""; return; }
  const when = new Date(S.lastCheck.at * 1000).toLocaleString([], {month: "short", day: "numeric", hour: "numeric", minute: "2-digit"});
  el.innerHTML = `· checked for new fonts ${esc(when)}` + (S.view === "New" && Object.keys(S.newFamilies).length
    ? ` · <button class="chip" data-act="clear-new" style="padding:1px 8px">Mark all as seen</button>` : "");
}

// ---------- boot ----------
(async function boot() {
  $("#preview").value = S.text; $("#size").value = S.size; updateSizeFill(); $("#sizeVal").textContent = S.size + "px"; $("#sort").value = S.sort; applyLayout();
  $("#empty").hidden = false; $("#empty").textContent = "Loading the font catalogs…";
  try {
    const [cat] = await Promise.all([api("/api/catalog"), refreshState()]);
    S.families = cat.families;
    S.families.forEach((f) => S.byName.set(f.family, f));
  } catch (e) {
    $("#empty").textContent = "Couldn't load the catalog: " + e.message;
    return;
  }
  const counts = {};
  S.families.forEach((f) => f.subsets.forEach((s) => { if (s !== "menu") counts[s] = (counts[s] || 0) + 1; }));
  const subs = Object.keys(counts).sort((a, b) => counts[b] - counts[a]);
  $("#subset").innerHTML = `<option value="">All languages</option>` +
    subs.map((s) => `<option value="${esc(s)}">${esc(s.replace(/-/g, " ").replace(/\b\w/g, (c) => c.toUpperCase()))} (${counts[s]})</option>`).join("");
  if (!counts[S.subset]) S.subset = "";
  $("#subset").value = S.subset;
  const bySource = {};
  S.families.forEach((f) => { bySource[f.source || "google"] = (bySource[f.source || "google"] || 0) + 1; });
  $("#source").innerHTML = `<option value="">All libraries (${S.families.length.toLocaleString()})</option>` +
    Object.keys(SOURCE_NAMES).filter((k) => bySource[k]).map((k) => `<option value="${k}">${SOURCE_NAMES[k]} (${bySource[k].toLocaleString()})</option>`).join("");
  if (!bySource[S.source]) S.source = "";
  $("#source").value = S.source;
  renderChips();
  render();
  renderBanner();
})();
</script>
</body>
</html>
